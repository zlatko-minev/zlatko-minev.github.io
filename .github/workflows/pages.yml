# Build zlatko-minev.com and deploy it to GitHub Pages.
# The Notebook is its own repo. Read its public source catalog directly so builds
# also work during a domain cutover. The publish gate fails on draft markers.
name: site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image library
        run: pip install pillow
      - name: Build and run the publish gate
        run: python3 tools/build.py --publish --notebook-library https://raw.githubusercontent.com/zlatko-minev/notebook/main/catalog.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
